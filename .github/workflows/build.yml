name: Build & Release

env:
  GH_TOKEN: ${{ SECRETS.GITHUB_TOKEN }}

on:
  push:
    branches:
      - master

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Resolve release tag from package.json
        id: meta
        run: |
          # electron-builder derives its release tag from the package.json version
          # (v<version>); resolve the same value so we can create the release up front.
          VERSION=$(bun -e 'console.log(require("./package.json").version)')
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create the draft release up front
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          # The build matrix runs in parallel and each electron-builder invocation
          # would otherwise create its own draft release, racing into duplicate
          # drafts for the same tag. Creating it once here means every build job
          # just uploads its assets to the existing release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, reusing it."
          else
            gh release create "$TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes "Automated release build."
          fi

  linux_x64:
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build:all

      - name: Release
        if: contains(github.ref, 'master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx electron-builder --linux --publish always

  exe:
    needs: prepare
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build:all

      - name: Release
        if: contains(github.ref, 'master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx electron-builder --win --publish always
