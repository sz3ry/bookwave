name: Pre-Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or refs/pull/<n>/head to build."
        required: true
        default: develop

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            flag: --linux
          - name: win
            os: windows-latest
            flag: --win

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build:all

      - name: Package
        run: bunx electron-builder ${{ matrix.flag }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bookwave-${{ matrix.name }}
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.exe
          if-no-files-found: error
